# Production-ish stack (single host, nginx in front).
#
# Secrets are declared with `:?` so `docker compose up` fails immediately with a
# readable message when they are missing, instead of shipping a known weak
# default into production.
#
# APP_ENV defaults to "production" here, which turns on SSRF protection in the
# target-agent connector and the Secure flag on the refresh cookie.

x-backend-env: &backend-env
  POSTGRES_USER: ${POSTGRES_USER:-crucible}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}"
  POSTGRES_DB: ${POSTGRES_DB:-crucible}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production}"
  S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in production}"
  S3_BUCKET_TRACES: ${S3_BUCKET_TRACES:-crucible-traces}
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}"
  CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required in production - generate one with Fernet.generate_key()}"
  APP_ENV: ${APP_ENV:-production}
  # Comma-separated list of origins allowed to call the API with credentials.
  ALLOW_ORIGINS: ${ALLOW_ORIGINS:-}
  # Number of trusted reverse proxies in front of the app. nginx below is one.
  # This is what makes X-Forwarded-For parsing safe.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: crucible-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crucible}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}"
      POSTGRES_DB: ${POSTGRES_DB:-crucible}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crucible}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crucible-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: crucible-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: crucible-minio
    restart: always
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in production}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: crucible-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing local/${S3_BUCKET_TRACES:-crucible-traces} &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crucible-backend
    restart: always
    environment: *backend-env
    # --no-proxy-headers is deliberate. Uvicorn's proxy-header handling is ON by
    # default and rewrites request.client from X-Forwarded-For, which would
    # silently override the application's own TRUSTED_PROXY_COUNT policy. Worse,
    # --forwarded-allow-ips='*' makes uvicorn take the LEFTMOST (client-supplied)
    # hop, reintroducing the rate-limit bypass. Let the app own this decision.
    command: >
      sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crucible-celery-worker
    restart: always
    environment: *backend-env
    command: celery -A backend.worker.celery_app worker --loglevel=info -c 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crucible-celery-beat
    restart: always
    environment: *backend-env
    command: celery -A backend.worker.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at BUILD time, so this must be a build
        # arg — setting it as a runtime env var has no effect.
        # Leave empty when serving through the bundled nginx: the browser then
        # uses same-origin relative URLs, which is also what the SSE client needs.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: crucible-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: crucible-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
