[project]
name = "crucible"
version = "0.1.0"
description = "Autonomous AI Agent Evaluation & Evolution Platform"
authors = [
    { name = "Krish Aggarwal", email = "krish@example.com" }
]
dependencies = [
    "fastapi[standard]>=0.111.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "qdrant-client>=1.10.0",
    "pydantic-settings>=2.3.4",
    "litellm>=1.41.0",
    "instructor>=1.3.4",
    "langgraph>=0.1.7",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "aiobotocore>=2.13.0",
    "psycopg2-binary>=2.9.9",
    "tenacity>=8.4.2",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "tiktoken>=0.13.0",
    "pydantic>=2.13.4",
    "sse-starlette>=2.1.2",
    "cryptography>=49.0.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.4.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
