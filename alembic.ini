# A generic, single database configuration.

[alembic]
script_location = src/backend/db/migrations
prepend_sys_path = .
version_path_separator = os

# URL is overridden in env.py from Settings — this is just a fallback
sqlalchemy.url = postgresql://crucible:crucible_secret@localhost:5432/crucible

[post_write_hooks]
# Uncomment to auto-format migration files with ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
